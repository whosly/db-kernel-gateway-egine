<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-theme-pref="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据库管控台</title>
    <script>
      (function () {
        try {
          var KEY = 'console-theme';
          var pref = localStorage.getItem(KEY) || 'light';
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'light';
          var theme = pref;
          if (pref === 'system') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-theme-pref', pref);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.setAttribute('data-theme-pref', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
