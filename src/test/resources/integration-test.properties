# Default committed props: integration OFF so -Pintegration-test without local
# overrides skips via Assumptions.assumeTrue (does not hard-fail).
# Skip strategy (P2-6):
#   1) Default `mvn test` excludes **/*IntegrationTest.java (surefire).
#   2) `mvn -Pintegration-test test` runs IntegrationTest classes; if
#      integration.enabled=false (this file) and no local override, each test
#      assumeTrue-skips with a clear reason — CI stays green without Docker.
#   3) To actually run: copy/create integration-test-local.properties (gitignored)
#      with integration.enabled=true and real host/port/password.
# Testcontainers profile stub: -Pintegration-testcontainers (see pom.xml) is
# reserved / not wired yet — do not require Docker for default unit tests.

integration.enabled=false

integration.mysql.host=localhost
integration.mysql.port=13308
integration.mysql.username=root
integration.mysql.password=
integration.mysql.database=mysql
integration.mysql.proxy-port=0

integration.postgresql.host=localhost
integration.postgresql.port=5432
integration.postgresql.username=postgres
integration.postgresql.password=
integration.postgresql.database=postgres
integration.postgresql.proxy-port=0
