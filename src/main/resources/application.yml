server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: db-kernel-gateway

# Gateway proxy configuration
gateway:
  # Proxy listen port (protocol-specific adapter binds here)
  proxy-port: ${GATEWAY_PROXY_PORT:3307}
  # Target database (fallback when backend-endpoints is empty)
  target-host: ${GATEWAY_TARGET_HOST:127.0.0.1}
  target-port: ${GATEWAY_TARGET_PORT:3306}
  target-username: ${GATEWAY_TARGET_USERNAME:}
  target-password: ${GATEWAY_TARGET_PASSWORD:}
  target-database: ${GATEWAY_TARGET_DATABASE:}
  # Comma-separated failover list: host:port,host:port
  # When set, overrides single target-host/target-port for BackendProvider.
  backend-endpoints: ${GATEWAY_BACKEND_ENDPOINTS:}
  virtual-threads: ${GATEWAY_VIRTUAL_THREADS:true}
  # require-cleartext-inspection: true
  # When true, TLS/opaque tunnel sessions are denied (fail-closed for audit).
  # Default false: opaque tunnels are allowed but not inspected.
  max-connections: ${GATEWAY_MAX_CONNECTIONS:256}
  idle-timeout-millis: ${GATEWAY_IDLE_TIMEOUT_MILLIS:0}
  proxy-db-type: ${GATEWAY_PROXY_DB_TYPE:mysql}

logging:
  level:
    root: INFO
    com.whosly.gateway: INFO
