server:
  # HTTP 服务端口，比如 actuator、controller 之类的 Web 入口。
  port: 8080

gateway:
  # 数据库网关代理的数据库类型
  proxy-db-type: postgresql
  # PostgreSQL 客户端连接网关时使用的本地代理端口。
  proxy-port: 35433

  target:
    # 网关后端转发到的真实的数据库服务。
    host: localhost
    port: 5432
    username: postgres
    password: change-me
    database: postgres

  # Client SoTimeout in seconds; 0 disables (matches GatewayConfig).
  idle-timeout-seconds: 0
  # max-connections: 200
  # allowed-client-cidrs:
  # Risk deny lists (empty / omitted = allow-all, backward compatible).
  # risk:
  #   denied-operations:           # e.g. COM_PROCESS_KILL
  #   denied-statement-keywords:   # e.g. drop table,truncate

  # Shared infrastructure (any proxy-db-type):
  # pool:
  #   enabled: false
  #   max-idle: 8
  #   reset-mode: none   # none | protocol (wire reset via BackendSessionReset SPI)
  # tls:
  #   enabled: false
  #   keystore-path: /path/to/gateway.p12
  #   keystore-password: change-me-in-env-not-in-git
  #   keystore-type: PKCS12
