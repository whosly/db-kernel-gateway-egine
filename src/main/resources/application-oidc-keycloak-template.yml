# OIDC + Keycloak 实验室模板（非生产）
# 用法：
#   1) docker compose -f docker-compose.keycloak.yml up -d
#   2) cp src/main/resources/application-oidc-keycloak-template.yml \
#         src/main/resources/application-dev.yml
#   3) mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   4) 打开 http://localhost:8080/console/login → 「使用 SSO 登录」
#
# 与 deploy/keycloak/realm-gateway.json 对齐（client-secret=change-me）。
# application-dev.yml 已 gitignore，勿把生产密钥写入仓库。

server:
  port: 8080
  # Session 须在 IdP 顶层回跳时带上（SameSite=Lax）；实验室 HTTP 勿开 Secure
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false

gateway:
  proxy-db-type: mysql
  proxy-port: 33307
  target:
    host: 127.0.0.1
    port: 3306
    username: demo
    password: change-me
    database: demo
  console:
    auth:
      mode: oidc
      oidc:
        provider: keycloak
        registration-id: console
        issuer-uri: http://localhost:8081/realms/gateway
        client-id: gateway-console
        client-secret: change-me
        # provider=keycloak 时可不写显式 URI；需要无猜测时可取消注释：
        # authorization-uri: http://localhost:8081/realms/gateway/protocol/openid-connect/auth
        # token-uri: http://localhost:8081/realms/gateway/protocol/openid-connect/token
        # jwk-set-uri: http://localhost:8081/realms/gateway/protocol/openid-connect/certs
        # user-info-uri: http://localhost:8081/realms/gateway/protocol/openid-connect/userinfo
        role-claim: realm_access.roles
        admin-role-values: CONSOLE_ADMIN,admin,console-admin
        viewer-role-values: CONSOLE_VIEWER,viewer,console-viewer
        scopes: openid,profile,email
