server:
  # HTTP 服务端口，比如 actuator、controller 之类的 Web 入口。
  port: 8080

gateway:
  # 数据库网关代理的数据库类型（别名 mssql 亦可）
  proxy-db-type: sqlserver
  # SQL Server 客户端连接网关时使用的本地代理端口（→ 目标 1433）。
  proxy-port: 31433

  target:
    # 网关后端转发到的真实的数据库服务。
    host: localhost
    port: 1433
    username: sa
    # 模板占位符 — 勿把生产密码提交进 git；本地 Docker 示例见 docs/OPS.md / SQLSERVER_TDS_PLAN.md
    password: change-me
    database: master

  # Client SoTimeout in seconds; 0 disables (matches GatewayConfig).
  idle-timeout-seconds: 0
  # max-connections: 200
  # allowed-client-cidrs:
  # Risk deny lists (empty / omitted = allow-all, backward compatible).
  # risk:
  #   denied-operations:
  #   denied-statement-keywords:

  # Shared infrastructure (any proxy-db-type):
  # pool:
  #   enabled: false
  #   max-idle: 8
  #   reset-mode: none   # none | protocol (SQL Server BackendSessionReset 尚未实现，protocol 等同 none)
  # tls:
  #   enabled: false
  #   keystore-path: /path/to/gateway.p12
  #   keystore-password: change-me-in-env-not-in-git
  #   keystore-type: PKCS12

  # Optional protocol-agnostic routing (default off):
  # routing:
  #   enabled: true
  #   rules:
  #     - match-database: app_a
  #       endpoints: hostA:1433
  #     - match-username: readonly
  #       endpoints: hostR:1433
